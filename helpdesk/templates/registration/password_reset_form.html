<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><style>body{font:16px Arial;background:#f8fafc;color:#0f172a}.box{max-width:430px;margin:10vh auto;padding:32px;background:white;border-radius:18px;box-shadow:0 12px 40px #17255418}input,button{font:inherit;padding:12px;border-radius:8px}input{width:92%;border:1px solid #cbd5e1}button{margin-top:12px;background:#3b82f6;color:white;border:0}</style></head><body><main class="box"><h1>Forgot your password?</h1><p>Enter your account email. In demo mode, the reset link is printed in the server console.</p><form method="post">{% csrf_token %}{{ form.email.errors }}{{ form.email }}<br><button>Send reset link</button></form><p><a href="{% url 'login' %}">Back to sign in</a></p></main></body></html>
