<!doctype html><html><head><meta charset="utf-8"><title>Choose a new password</title></head><body style="font:16px Arial;background:#f8fafc;color:#0f172a"><main style="max-width:500px;margin:12vh auto;padding:32px;background:white;border-radius:18px"><h1>Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button style="padding:12px;background:#3b82f6;color:white;border:0;border-radius:8px">Change password</button></form>{% else %}<p>This reset link is invalid or expired. Request a new one.</p><a href="{% url 'password_reset' %}">Request another link</a>{% endif %}</main></body></html>
